name: PR Guard (.NET)

on:
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: pr-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj

      - name: Restore
        run: dotnet restore Server.sln

      - name: Build
        run: dotnet build Server.sln --configuration Release --no-restore

      - name: Test 
        shell: pwsh
        run: |
          $testProjects = Get-ChildItem -Path "Server" -Recurse -Filter "*.csproj" | Where-Object {
            $_.Name -match "Tests?\.csproj$"
          }

          if (-not $testProjects) {
            Write-Host "No test projects found. Skipping dotnet test."
            exit 0
          }

          foreach ($proj in $testProjects) {
            Write-Host "Running tests for $($proj.FullName)"
            dotnet test $proj.FullName --configuration Release --verbosity minimal
          }
